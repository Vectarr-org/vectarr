<!DOCTYPE HTML PUBLIC "-//W3C//DTD XHTML 1.0 Transitional //EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <!--[if !mso]><!-->
    <meta http-equiv="X-UA-Compatible" content="IE=edge"><!--<![endif]-->
    <title></title>

    <style type="text/css">
        @media only screen and (min-width: 620px) {
            .u-row {
                width: 600px !important;
            }

                .u-row .u-col {
                    vertical-align: top;
                }

                .u-row .u-col-100 {
                    width: 600px !important;
                }
        }

        @media (max-width: 620px) {
            .u-row-container {
                max-width: 100% !important;
                padding-left: 0px !important;
                padding-right: 0px !important;
            }

            .u-row .u-col {
                min-width: 320px !important;
                max-width: 100% !important;
                display: block !important;
            }

            .u-row {
                width: 100% !important;
            }

            .u-col {
                width: 100% !important;
            }

                .u-col > div {
                    margin: 0 auto;
                }

            #u_column_2 .v-col-border {
                border-top: 5px solid #2563eb !important;
                border-left: 5px solid #2563eb !important;
                border-right: 5px solid #2563eb !important;
                border-bottom: 5px solid #2563eb !important;
            }
        }

        body {
            margin: 0;
            padding: 0;
        }

        table, tr, td {
            vertical-align: top;
            border-collapse: collapse;
        }

        p {
            margin: 0;
        }

        .ie-container table,
        .mso-container table {
            table-layout: fixed;
        }

        * {
            line-height: inherit;
        }

        a[x-apple-data-detectors='true'] {
            color: inherit !important;
            text-decoration: none !important;
        }

        table, td {
            color: #0f172a;
        }

        #u_body a {
            color: #2563eb;
            text-decoration: underline;
        }
    </style>

    <!--[if !mso]><!-->
    <link href="https://fonts.googleapis.com/css?family=Raleway:400,700&display=swap" rel="stylesheet" type="text/css"><!--<![endif]-->
</head>

<body class="clean-body u_body" style="margin:0;padding:0;-webkit-text-size-adjust:100%;background-color:#eff6ff;color:#0f172a">
    <table id="u_body" style="border-collapse:collapse;table-layout:fixed;border-spacing:0;mso-table-lspace:0pt;mso-table-rspace:0pt;vertical-align:top;min-width:320px;Margin:0 auto;background-color:#eff6ff;width:100%" cellpadding="0" cellspacing="0">
        <tbody>
            <tr>
                <td style="word-break:break-word;border-collapse:collapse !important;vertical-align:top">

                    <div class="u-row-container" style="padding:0;background-color:transparent">
                        <div class="u-row" style="margin:0 auto;min-width:320px;max-width:600px;background-color:transparent;">
                            <div style="display:table;width:100%;height:100%;background-color:transparent;">
                                <div id="u_column_2" class="u-col u-col-100" style="min-width:600px;display:table-cell;vertical-align:top;">
                                    <div style="background-color:#ffffff;height:100%;width:100% !important;">
                                        <div class="v-col-border" style="box-sizing:border-box;height:100%;padding:0;border:15px solid #2563eb;">

                                            <!-- Logo -->
                                            <table style="font-family:'Raleway',sans-serif;" role="presentation" cellpadding="0" cellspacing="0" width="100%" border="0">
                                                <tbody>
                                                    <tr>
                                                        <td style="overflow-wrap:break-word;word-break:break-word;padding:30px 10px 10px;font-family:'Raleway',sans-serif;" align="left">
                                                            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                                                <tr>
                                                                    <td style="padding-right:0px;padding-left:0px;" align="center">
                                                                        <a href="https://vectarr.com/" target="_blank">
                                                                            <img align="center" border="0" src="https://vectarr.com/assets/logo-vectarr.png" alt="Vectarr" title="Vectarr" style="outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;clear:both;display:inline-block !important;border:none;height:auto;float:none;width:17%;max-width:34.8px;" width="34.8" />
                                                                        </a>
                                                                    </td>
                                                                </tr>
                                                            </table>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>

                                            <!-- Body Text -->
                                            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                                <tr>
                                                    <td style="padding:20px 40px 10px;font-family:'Raleway',sans-serif;font-size:15px;line-height:1.6;color:#0f172a;">
                                                        <p>
                                                            Dear {{EmailAddress}},<br /><br />
                                                            You're officially part of the <strong>Vectarr</strong> family!<br /><br />
                                                            — The Vectarr Team
                                                        </p>
                                                    </td>
                                                </tr>
                                            </table>

                                            <!-- CTA Button -->
                                            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                                <tr>
                                                    <td style="padding:10px 40px;">
                                                        <a href="{{RegisterVerificationLink}}" target="_blank"
                                                           style="display:inline-block;background-color:#2563eb;color:#ffffff;padding:12px 24px;border-radius:10px;text-decoration:none;font-weight:600;">
                                                            Verify your email
                                                        </a>
                                                    </td>
                                                </tr>
                                            </table>

                                            <!-- Fallback Link (smaller, muted, wraps properly) -->
                                            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                                <tr>
                                                    <td style="padding:10px 40px 30px;font-family:'Raleway',sans-serif;font-size:11px;color:#94a3b8;line-height:1.4;">
                                                        <p style="margin-bottom:4px;">
                                                            If the button doesn't work, copy and paste this link:
                                                        </p>
                                                        <p style="word-break:break-all;overflow-wrap:break-word;">
                                                            <a href="{{RegisterVerificationLink}}" target="_blank" style="color:#94a3b8;font-size:11px;text-decoration:underline;">
                                                                {{RegisterVerificationLink}}
                                                            </a>
                                                        </p>
                                                    </td>
                                                </tr>
                                            </table>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
